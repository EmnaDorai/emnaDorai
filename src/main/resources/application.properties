# Nom de l'application
spring.application.name=TP-Projet-2025

# DB Configuration
spring.datasource.url=jdbc:mysql://mysql-service:3306/tpdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Context Path de l'application
server.servlet.context-path=/tpProjet

# Actuator (avec base path explicite)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.server.base-path=/actuator

